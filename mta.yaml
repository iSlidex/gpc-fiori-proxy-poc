_schema-version: "3.3"

ID: gpc-fiori-proxy-poc
version: 0.0.2
description: POC AppRouter for S4 Fiori through Cloud Connector

modules:
  - name: gpc-fiori-proxy-approuter
    type: approuter.nodejs
    path: .
    parameters:
      memory: 256M
      disk-quota: 1G
      keep-existing-routes: true
    properties:
      # Evita que @sap/approuter añada SAMEORIGIN. index.js aplica una política
      # frame-ancestors explícita tanto a /poc como a las respuestas /sap.
      SEND_XFRAMEOPTIONS: "false"
      CX_FRAME_ANCESTOR: "https://my1002084.us1.test.crm.cloud.sap"
      # El padre efectivo del proxy será el AppRouter autenticado del BFF.
      GPC_FRAME_ANCESTOR: "https://gpc-creacion-solicitud-contrato-router.cfapps.us10-001.hana.ondemand.com"
      BAS_FRAME_ANCESTOR: "https://*.applicationstudio.cloud.sap"
      # Conserva temporalmente el origen anterior para rollback.
      EXTRA_FRAME_ANCESTORS: "https://gpc-creacion-solicitud-contrato.cfapps.us10-001.hana.ondemand.com"
    requires:
      - name: gpc-fiori-proxy-xsuaa
      - name: gpc-fiori-proxy-destination
      - name: gpc-fiori-proxy-connectivity

resources:
  - name: gpc-fiori-proxy-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: gpc-fiori-proxy-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: gpc-fiori-proxy-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
