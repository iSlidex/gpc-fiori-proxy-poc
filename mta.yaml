_schema-version: "3.3"

ID: gpc-fiori-proxy-poc
version: 0.0.2
description: POC AppRouter for S4 Fiori through Cloud Connector

modules:
  - name: gpc-fiori-proxy-approuter
    type: approuter.nodejs
    path: .
    parameters:
      memory: 256M
      disk-quota: 1G
      keep-existing-routes: true
    properties:
      # @sap/approuter envía X-Frame-Options: SAMEORIGIN por defecto.
      # El proxy debe poder abrirse dentro del mashup/monitor y la protección
      # de F2403 se mantiene mediante su handshake SAPFrameProtection.
      SEND_XFRAMEOPTIONS: "false"
      httpHeaders: >-
        [{"Content-Security-Policy":"frame-ancestors 'self' https://my1002084.us1.test.crm.cloud.sap https://gpc-creacion-solicitud-contrato.cfapps.us10-001.hana.ondemand.com https://*.applicationstudio.cloud.sap"}]
    requires:
      - name: gpc-fiori-proxy-xsuaa
      - name: gpc-fiori-proxy-destination
      - name: gpc-fiori-proxy-connectivity

resources:
  - name: gpc-fiori-proxy-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: gpc-fiori-proxy-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: gpc-fiori-proxy-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
